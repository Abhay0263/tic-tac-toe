<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe Pro</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <div id="toast-container" class="toast-container"></div>

  <div class="app-container">
    <header>
      <h1>Tic Tac Toe</h1>
      <p class="subtitle">Cyber Edition 1.0</p>
    </header>

    <div id="dashboard" class="card">
      <div class="button-group">
        <button class="btn btn-primary" onclick="startNewGame()">New Game</button>
        <button class="btn btn-secondary" onclick="playWithBot()">Play With Bot</button>
      </div>

      <div class="leaderboard-section">
        <h2>Leaderboard</h2>
        <div id="leaderboard" class="stats-box">
          <ul id="leaderboard-list">
            <li>Loading stats...</li>
          </ul>
        </div>
      </div>
    </div>

    <div id="game" class="card" style="display:none;">
      <div id="status-display" style="margin-bottom: 15px; font-weight: bold;"></div>
      <div id="board" class="grid-container"></div>
      <div class="game-controls">
        <button class="btn btn-danger" onclick="location.reload()">Quit</button>
        <button class="btn btn-success" onclick="resetGame()">Rematch</button>
      </div>
    </div>
    <!-- Username Modal -->
    <div id="username-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content card">
        <h2 id="modal-title">Enter Usernames</h2>
        <div class="input-group">
          <label for="player1-input" id="p1-label">Player 1 Username:</label>
          <input type="text" id="player1-input" class="modern-input" placeholder="Enter username...">
        </div>
        <div class="input-group" id="player2-group">
          <label for="player2-input">Player 2 Username:</label>
          <input type="text" id="player2-input" class="modern-input" placeholder="Enter username...">
        </div>
        <div class="button-group modal-buttons">
          <button class="btn btn-primary" id="start-match-btn">Start Match</button>
          <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Custom Confirm Modal -->
    <div id="confirm-modal" class="modal-overlay" style="display: none; z-index: 3000;">
      <div class="modal-content card" style="text-align: center;">
        <h3 id="confirm-message" style="margin-top: 0; font-size: 1.2rem; font-weight: normal;"></h3>
        <div class="button-group modal-buttons" style="margin-top: 20px;">
          <button class="btn btn-success" id="confirm-yes-btn">Yes, that's me</button>
          <button class="btn btn-danger" id="confirm-no-btn">No, enter another</button>
        </div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
